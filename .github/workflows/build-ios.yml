name: Build TablePro iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build TablePro iOS IPA
    runs-on: macos-latest

    env:
      GH_TOKEN: ${{ github.token }}

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # 2. Environment
      # ============================================================

      - name: Show environment
        run: |
          set -e

          echo "===== macOS ====="
          sw_vers

          echo ""
          echo "===== Xcode ====="
          xcodebuild -version

          echo ""
          echo "===== Swift ====="
          swift --version

          echo ""
          echo "===== GitHub CLI ====="
          gh --version


      # ============================================================
      # 3. GitHub API
      # ============================================================

      - name: Check GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          gh auth status

          echo ""
          echo "GitHub API rate limit:"

          gh api rate_limit \
            --jq '.resources.core |
              "limit=\(.limit)\nremaining=\(.remaining)\nreset=\(.reset)"'


      # ============================================================
      # 4. Download libraries
      # ============================================================

      - name: Download libraries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          chmod +x scripts/download-libs.sh

          ./scripts/download-libs.sh


      # ============================================================
      # 5. Prepare configuration
      # ============================================================

      - name: Prepare configuration
        run: |
          set -e

          if [ ! -f "Secrets.xcconfig" ]; then
            echo "Creating Secrets.xcconfig"
            touch Secrets.xcconfig
          fi

          if [ ! -f "TableProMobile/Secrets.xcconfig" ]; then
            echo "Creating TableProMobile/Secrets.xcconfig"
            touch TableProMobile/Secrets.xcconfig
          fi


      # ============================================================
      # 6. Create iOS shared scheme
      # ============================================================

      - name: Create TableProMobile scheme
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="TableProMobile/TableProMobile.xcodeproj"

          SCHEME_DIR="$PROJECT/xcshareddata/xcschemes"

          mkdir -p "$SCHEME_DIR"

          cat > "$SCHEME_DIR/TableProMobile.xcscheme" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <Scheme
             LastUpgradeVersion = "2660"
             version = "1.3">

             <BuildAction
                parallelizeBuildables = "YES"
                buildImplicitDependencies = "YES">

                <BuildActionEntries>

                   <BuildActionEntry
                      buildForTesting = "YES"
                      buildForRunning = "YES"
                      buildForProfiling = "YES"
                      buildForArchiving = "YES"
                      buildForAnalyzing = "YES">

                      <BuildableReference
                         BuildableIdentifier = "primary"
                         BlueprintIdentifier = "5AB9F3D42F7C1C12001F3337"
                         BuildableName = "TableProMobile.app"
                         BlueprintName = "TableProMobile"
                         ReferencedContainer = "container:TableProMobile.xcodeproj">
                      </BuildableReference>

                   </BuildActionEntry>

                </BuildActionEntries>

             </BuildAction>


             <TestAction
                buildConfiguration = "Debug"
                selectedDebuggerIdentifier = "Xcode.DebuggerFoundation.Debugger.LLDB"
                selectedLauncherIdentifier = "Xcode.DebuggerFoundation.Launcher.LLDB"
                shouldUseLaunchSchemeArgsEnv = "YES">

             </TestAction>


             <LaunchAction
                buildConfiguration = "Release"
                selectedDebuggerIdentifier = "Xcode.DebuggerFoundation.Debugger.LLDB"
                selectedLauncherIdentifier = "Xcode.DebuggerFoundation.Launcher.LLDB"
                launchStyle = "0"
                useCustomWorkingDirectory = "NO"
                ignoresPersistentStateOnLaunch = "NO"
                debugDocumentVersioning = "YES"
                debugServiceExtension = "internal"
                allowLocationSimulation = "YES">

                <BuildableProductRunnable
                   runnableDebuggingMode = "0">

                   <BuildableReference
                      BuildableIdentifier = "primary"
                      BlueprintIdentifier = "5AB9F3D42F7C1C12001F3337"
                      BuildableName = "TableProMobile.app"
                      BlueprintName = "TableProMobile"
                      ReferencedContainer = "container:TableProMobile.xcodeproj">
                   </BuildableReference>

                </BuildableProductRunnable>

             </LaunchAction>


             <ProfileAction
                buildConfiguration = "Release"
                shouldUseLaunchSchemeArgsEnv = "YES"
                savedToolIdentifier = ""
                useCustomWorkingDirectory = "NO"
                debugDocumentVersioning = "YES">

                <BuildableProductRunnable
                   runnableDebuggingMode = "0">

                   <BuildableReference
                      BuildableIdentifier = "primary"
                      BlueprintIdentifier = "5AB9F3D42F7C1C12001F3337"
                      BuildableName = "TableProMobile.app"
                      BlueprintName = "TableProMobile"
                      ReferencedContainer = "container:TableProMobile.xcodeproj">
                   </BuildableReference>

                </BuildableProductRunnable>

             </ProfileAction>


             <AnalyzeAction
                buildConfiguration = "Debug">
             </AnalyzeAction>


             <ArchiveAction
                buildConfiguration = "Release"
                revealArchiveInOrganizer = "YES"
                useCustomWorkingDirectory = "NO"
                allowNetworkAccess = "YES">
             </ArchiveAction>

          </Scheme>
          EOF

          echo "===== Created scheme ====="

          cat "$SCHEME_DIR/TableProMobile.xcscheme"


      # ============================================================
      # 7. Verify scheme
      # ============================================================

      - name: Verify scheme
        run: |
          set -e

          xcodebuild \
            -project "TableProMobile/TableProMobile.xcodeproj" \
            -list


      # ============================================================
      # 8. Resolve packages
      # ============================================================

      - name: Resolve Swift packages
        run: |
          set -euo pipefail

          xcodebuild \
            -resolvePackageDependencies \
            -project "TableProMobile/TableProMobile.xcodeproj" \
            -scheme "TableProMobile"


      # ============================================================
      # 9. Check iOS destinations
      # ============================================================

      - name: Check iOS destinations
        run: |
          set -e

          xcodebuild \
            -project "TableProMobile/TableProMobile.xcodeproj" \
            -scheme "TableProMobile" \
            -showdestinations


      # ============================================================
      # 10. Build iOS application
      # ============================================================

      - name: Build iOS application
        shell: bash
        run: |
          set -o pipefail

          rm -rf build

          mkdir -p build/DerivedData

          xcodebuild \
            -project "TableProMobile/TableProMobile.xcodeproj" \
            -scheme "TableProMobile" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$GITHUB_WORKSPACE/build/DerivedData" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO \
            build \
            | tee build.log


      # ============================================================
      # 11. Find .app
      # ============================================================

      - name: Find generated app
        id: app
        shell: bash
        run: |
          set -euo pipefail

          DERIVED_DATA="$GITHUB_WORKSPACE/build/DerivedData"

          echo "===== Searching for .app ====="

          find "$DERIVED_DATA" \
            -type d \
            -name "*.app" \
            -print

          APP_PATH=$(
            find "$DERIVED_DATA" \
              -type d \
              -path "*/Build/Products/Release-iphoneos/*.app" \
              -print |
              head -n 1
          )

          if [ -z "$APP_PATH" ]; then

            echo ""
            echo "ERROR: No iOS .app found."

            echo ""
            echo "Build products:"

            find "$DERIVED_DATA/Build/Products" \
              -maxdepth 4 \
              -print || true

            exit 1
          fi

          echo ""
          echo "Found:"
          echo "$APP_PATH"

          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"


      # ============================================================
      # 12. Create IPA
      # ============================================================

      - name: Create IPA
        run: |
          set -euo pipefail

          APP_PATH="${{ steps.app.outputs.app_path }}"

          rm -rf build/IPA

          mkdir -p build/IPA/Payload

          cp -R \
            "$APP_PATH" \
            "build/IPA/Payload/TableProMobile.app"

          cd build/IPA

          zip -qry \
            "$GITHUB_WORKSPACE/TableProMobile-unsigned.ipa" \
            Payload

          echo ""
          echo "===== IPA CREATED ====="

          ls -lh \
            "$GITHUB_WORKSPACE/TableProMobile-unsigned.ipa"


      # ============================================================
      # 13. Inspect IPA
      # ============================================================

      - name: Inspect IPA
        run: |
          set -e

          ls -lh TableProMobile-unsigned.ipa

          echo ""
          echo "===== IPA CONTENT ====="

          unzip -l TableProMobile-unsigned.ipa | head -80


      # ============================================================
      # 14. Upload IPA
      # ============================================================

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TableProMobile-iOS-IPA
          path: TableProMobile-unsigned.ipa
          if-no-files-found: error
          retention-days: 7


      # ============================================================
      # 15. Upload logs when failed
      # ============================================================

      - name: Upload debug files
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TableProMobile-build-debug
          path: |
            build/
            build.log
          if-no-files-found: ignore
          retention-days: 3