name: Build TablePro iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build TablePro iOS IPA
    runs-on: macos-latest

    env:
      GH_TOKEN: ${{ github.token }}

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # 2. Environment
      # ============================================================

      - name: Show environment
        run: |
          echo "======================================"
          echo "macOS"
          echo "======================================"
          sw_vers

          echo ""
          echo "======================================"
          echo "Xcode"
          echo "======================================"
          xcodebuild -version

          echo ""
          echo "======================================"
          echo "Swift"
          echo "======================================"
          swift --version


      # ============================================================
      # 3. GitHub API authentication
      # ============================================================

      - name: Check GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          echo "GitHub authentication:"
          gh auth status

          echo ""
          echo "GitHub API rate limit:"

          gh api rate_limit \
            --jq '.resources.core |
              "limit=\(.limit)\nremaining=\(.remaining)\nreset=\(.reset)"'


      # ============================================================
      # 4. Download libraries
      # ============================================================

      - name: Download libraries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          echo "Downloading TablePro libraries..."

          chmod +x scripts/download-libs.sh

          ./scripts/download-libs.sh


      # ============================================================
      # 5. Create Secrets.xcconfig if missing
      # ============================================================

      - name: Prepare iOS configuration
        run: |
          set -e

          if [ ! -f "TableProMobile/Secrets.xcconfig" ]; then
            echo "Creating TableProMobile/Secrets.xcconfig"

            touch "TableProMobile/Secrets.xcconfig"
          else
            echo "TableProMobile/Secrets.xcconfig already exists"
          fi


      # ============================================================
      # 6. Verify iOS project
      # ============================================================

      - name: Verify iOS project
        run: |
          set -e

          PROJECT="TableProMobile/TableProMobile.xcodeproj"

          if [ ! -d "$PROJECT" ]; then
            echo "ERROR: iOS project not found:"
            echo "$PROJECT"
            exit 1
          fi

          echo "iOS project:"
          echo "$PROJECT"

          echo ""
          echo "Available schemes:"
          echo "======================================"

          xcodebuild \
            -project "$PROJECT" \
            -list


      # ============================================================
      # 7. Detect iOS scheme
      # ============================================================

      - name: Detect iOS scheme
        id: xcode
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="TableProMobile/TableProMobile.xcodeproj"

          echo "Project:"
          echo "$PROJECT"

          echo ""
          echo "Getting schemes..."

          SCHEMES=$(
            xcodebuild \
              -project "$PROJECT" \
              -list 2>/dev/null |
              awk '
                /^Schemes:/ {
                  found=1
                  next
                }

                found && NF {
                  gsub(/^[ \t]+/, "")
                  print
                }

                found && !NF {
                  exit
                }
              '
          )

          echo ""
          echo "Detected schemes:"
          echo "$SCHEMES"

          SCHEME=""

          # Prefer TableProMobile
          if echo "$SCHEMES" | grep -Fxq "TableProMobile"; then
            SCHEME="TableProMobile"
          fi

          # Fallback to TablePro
          if [ -z "$SCHEME" ] &&
             echo "$SCHEMES" | grep -Fxq "TablePro"; then
            SCHEME="TablePro"
          fi

          # Last fallback
          if [ -z "$SCHEME" ]; then
            SCHEME=$(echo "$SCHEMES" | head -n 1)
          fi

          if [ -z "$SCHEME" ]; then
            echo ""
            echo "ERROR: No scheme found."
            exit 1
          fi

          echo ""
          echo "======================================"
          echo "Using iOS project"
          echo "======================================"
          echo "PROJECT=$PROJECT"
          echo "SCHEME=$SCHEME"

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"


      # ============================================================
      # 8. Resolve Swift packages
      # ============================================================

      - name: Resolve Swift packages
        run: |
          set -euo pipefail

          PROJECT="${{ steps.xcode.outputs.project }}"
          SCHEME="${{ steps.xcode.outputs.scheme }}"

          echo "Resolving Swift packages..."

          xcodebuild \
            -resolvePackageDependencies \
            -project "$PROJECT" \
            -scheme "$SCHEME"


      # ============================================================
      # 9. Show iOS destinations
      # ============================================================

      - name: Check iOS destinations
        run: |
          set -e

          PROJECT="${{ steps.xcode.outputs.project }}"
          SCHEME="${{ steps.xcode.outputs.scheme }}"

          echo "Checking destinations for:"
          echo "$SCHEME"

          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -showdestinations


      # ============================================================
      # 10. Build iOS
      # ============================================================

      - name: Build iOS application
        run: |
          set -euo pipefail

          PROJECT="${{ steps.xcode.outputs.project }}"
          SCHEME="${{ steps.xcode.outputs.scheme }}"

          DERIVED_DATA="$GITHUB_WORKSPACE/build/DerivedData"

          rm -rf "$DERIVED_DATA"

          mkdir -p "$DERIVED_DATA"

          echo ""
          echo "======================================"
          echo "Building iOS"
          echo "======================================"

          echo "Project:"
          echo "$PROJECT"

          echo ""
          echo "Scheme:"
          echo "$SCHEME"

          echo ""
          echo "DerivedData:"
          echo "$DERIVED_DATA"

          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$DERIVED_DATA" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO \
            build


      # ============================================================
      # 11. Find .app
      # ============================================================

      - name: Find generated iOS app
        id: app
        shell: bash
        run: |
          set -euo pipefail

          DERIVED_DATA="$GITHUB_WORKSPACE/build/DerivedData"

          echo "Searching for iOS .app..."

          find "$DERIVED_DATA" \
            -type d \
            -name "*.app" \
            -print

          APP_PATH=$(
            find "$DERIVED_DATA" \
              -type d \
              -path "*/Build/Products/Release-iphoneos/*.app" \
              -print |
              head -n 1
          )

          if [ -z "$APP_PATH" ]; then
            echo ""
            echo "ERROR: iOS .app not found."

            echo ""
            echo "Products:"
            find "$DERIVED_DATA/Build/Products" \
              -maxdepth 4 \
              -print || true

            exit 1
          fi

          echo ""
          echo "======================================"
          echo "Found APP"
          echo "======================================"

          echo "$APP_PATH"

          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"


      # ============================================================
      # 12. Create IPA
      # ============================================================

      - name: Create IPA
        run: |
          set -euo pipefail

          APP_PATH="${{ steps.app.outputs.app_path }}"

          IPA_DIR="$GITHUB_WORKSPACE/build/IPA"
          PAYLOAD_DIR="$IPA_DIR/Payload"

          rm -rf "$IPA_DIR"

          mkdir -p "$PAYLOAD_DIR"

          echo "Copying:"
          echo "$APP_PATH"

          cp -R "$APP_PATH" "$PAYLOAD_DIR/"

          cd "$IPA_DIR"

          zip -qry \
            "$GITHUB_WORKSPACE/TablePro-iOS-unsigned.ipa" \
            Payload

          echo ""
          echo "======================================"
          echo "IPA CREATED"
          echo "======================================"

          ls -lh "$GITHUB_WORKSPACE/TablePro-iOS-unsigned.ipa"


      # ============================================================
      # 13. Inspect IPA
      # ============================================================

      - name: Inspect IPA
        run: |
          set -e

          echo "IPA:"
          ls -lh TablePro-iOS-unsigned.ipa

          echo ""
          echo "Contents:"
          unzip -l TablePro-iOS-unsigned.ipa | head -80


      # ============================================================
      # 14. Upload IPA
      # ============================================================

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TablePro-iOS-IPA
          path: TablePro-iOS-unsigned.ipa
          if-no-files-found: error
          retention-days: 7


      # ============================================================
      # 15. Upload build logs if failed
      # ============================================================

      - name: Upload debug files
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TablePro-iOS-build-debug
          path: |
            build/
          if-no-files-found: ignore
          retention-days: 3