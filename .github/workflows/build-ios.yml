name: Build TablePro iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    name: Build TablePro iOS
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        run: |
          xcodebuild -version
          xcode-select -p

      - name: First time setup
        run: |
          chmod +x scripts/download-libs.sh
          ./scripts/download-libs.sh
          touch Secrets.xcconfig

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project TablePro.xcodeproj

      - name: List schemes
        run: |
          xcodebuild \
            -project TablePro.xcodeproj \
            -list

      - name: Build TablePro
        shell: bash
        run: |
          set -o pipefail

          rm -rf build

          xcodebuild \
            -project TablePro.xcodeproj \
            -scheme TablePro \
            -configuration Debug \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$PWD/build/DerivedData" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build \
            | tee build.log

      - name: Find application
        shell: bash
        run: |
          set -eux

          echo "======================================"
          echo "Searching for .app"
          echo "======================================"

          find "$PWD/build" \
            -type d \
            -name "*.app" \
            -print

          APP_PATH=$(find "$PWD/build" \
            -type d \
            -name "*.app" \
            -path "*/Build/Products/*" \
            | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app found"
            echo ""
            echo "Build products:"
            find "$PWD/build" \
              -type d \
              -path "*/Build/Products/*" \
              -print

            echo ""
            echo "Last 100 lines of build.log:"
            tail -n 100 build.log

            exit 1
          fi

          echo "======================================"
          echo "APP FOUND:"
          echo "$APP_PATH"
          echo "======================================"

          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Create IPA
        shell: bash
        run: |
          set -eux

          rm -rf Payload
          rm -f TablePro.ipa

          mkdir Payload

          cp -R "$APP_PATH" Payload/TablePro.app

          echo "Creating IPA..."

          zip -r -9 TablePro.ipa Payload

          echo "======================================"
          echo "IPA:"
          ls -lh TablePro.ipa
          echo "======================================"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TablePro-iOS-IPA
          path: TablePro.ipa
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TablePro-build-log
          path: build.log
          if-no-files-found: warn